# ngrok configuration for exposing local FHIR and Snowstorm servers
#
# Setup:
# 1. Copy this file to ngrok.yml
# 2. Replace YOUR_NGROK_AUTHTOKEN_HERE with your actual token from https://dashboard.ngrok.com
# 3. Run: ngrok start --config ngrok.yml --all
# 4. Copy the generated URLs to Vercel environment variables
#
# For persistent URLs (paid ngrok plans), uncomment and set the domain lines

version: "3"
agent:
  authtoken: YOUR_NGROK_AUTHTOKEN_HERE

tunnels:
  fhir:
    proto: http
    addr: 8080
    # domain: your-fhir-server.ngrok.io

  snowstorm:
    proto: http
    addr: 8081
    # domain: your-snowstorm-server.ngrok.io
